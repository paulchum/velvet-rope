services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velvet_live_demo
      POSTGRES_USER: velvet_live
      POSTGRES_PASSWORD: velvet_live
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velvet_live -d velvet_live_demo"]
      interval: 1s
      timeout: 3s
      retries: 40
    volumes:
      - velvet_live_demo_postgres:/var/lib/postgresql/data

volumes:
  velvet_live_demo_postgres:
