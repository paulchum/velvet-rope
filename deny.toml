[advisories]
version = 2
yanked = "warn"
# Temporary: PyO3 0.29.0 is the fix for these advisories, but the current
# contributor environment cannot resolve crates.io to fetch the new archives.
# Remove these ignores when `pyo3` and `pythonize` are upgraded to >=0.29.0.
ignore = [
  "RUSTSEC-2026-0176",
  "RUSTSEC-2026-0177",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
