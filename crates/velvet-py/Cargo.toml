[package]
name = "velvet-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 bindings for the Velvet routing kernel."

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
velvet-core = { path = "../velvet-core" }
velvet-policy-loader = { path = "../velvet-policy-loader" }
pyo3.workspace = true
pythonize.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = []
legacy-heuristic-routing = ["velvet-core/legacy-heuristic-routing"]
