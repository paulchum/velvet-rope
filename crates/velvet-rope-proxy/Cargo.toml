[package]
name = "velvet-rope-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pre-execution MCP proxy for Velvet Rope admission."

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
base64 = "0.22.1"
chrono.workspace = true
clap = { version = "4.5.53", features = ["derive"] }
ed25519-dalek = "2.2.0"
reqwest = { version = "0.13.4", features = ["blocking", "json", "stream"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = "0.1.18"
tower = { version = "0.5.3", features = ["limit"] }
uuid.workspace = true
velvet-core = { path = "../velvet-core" }
velvet-policy-loader = { path = "../velvet-policy-loader" }
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3.23.0"

[[bin]]
name = "velvet-rope-proxy"
path = "src/main.rs"
