[workspace]
members = [
  "crates/velvet-core",
  "crates/velvet-eval",
  "crates/velvet-policy-loader",
  "crates/velvet-policies",
  "crates/velvet-py",
  "crates/velvet-closure",
  "crates/velvet-rope-proxy",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "1.0.0"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
pyo3 = { version = "0.26.0", features = ["extension-module"] }
pythonize = "0.26.0"
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
