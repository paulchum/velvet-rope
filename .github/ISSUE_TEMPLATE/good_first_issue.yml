name: Good first issue
description: Use this to file a small, well-bounded contributor task.
title: "good first issue: "
labels:
  - good first issue
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the concrete change and the files likely involved.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: List the checks or docs updates that make the task complete.
      placeholder: |
        - Add or update a focused test.
        - Update the relevant docs.
        - Run uv run pytest tests/test_name.py -q.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to docs, code, tests, or benchmark artifacts that help a new contributor get oriented.
    validations:
      required: false
