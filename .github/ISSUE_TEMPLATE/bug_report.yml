name: Bug report
description: Report reproducible Velvet behavior that looks incorrect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a focused report. Please avoid posting secrets, private ledger records, proprietary policies, or customer data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands, policy snippets, fixture inputs, or test cases that reproduce the issue.
      placeholder: |
        uv run velvet demo --output-dir reports/demo --json
        uv run pytest tests/test_name.py -q
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Rust, Velvet version, install method, and whether Docker was involved.
      placeholder: |
        macOS 15.5, Python 3.12, rustc 1.87, velvet-rope 0.9.0, source install
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or evidence
      description: Paste short logs or sanitized paths to generated artifacts. Redact secrets and private data.
      render: shell
    validations:
      required: false
