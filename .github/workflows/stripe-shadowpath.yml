name: Stripe ShadowPath

on:
  push:
    paths:
      - src/velvet/stripe_*.py
      - tests/test_stripe_*.py
      - examples/shadowpath/stripe/**
      - .github/workflows/stripe-shadowpath.yml
      - crates/velvet-rope-proxy/**
  pull_request:
    paths:
      - src/velvet/stripe_*.py
      - tests/test_stripe_*.py
      - examples/shadowpath/stripe/**
      - .github/workflows/stripe-shadowpath.yml
      - crates/velvet-rope-proxy/**
  workflow_dispatch:
    inputs:
      run_sandbox:
        description: Execute actual hosted Stripe sandbox requests (creates test payments/refunds)
        required: true
        type: boolean
        default: false
      with_direct_route:
        description: Test a REST credential genuinely available to the agent
        required: true
        type: boolean
        default: false
      isolated_agent:
        description: Gateway-only Linux agent with no Stripe keys or network (separate access model)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stripe-shadowpath-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  offline:
    name: Offline protocol and measurement tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source-only test tools
        run: python -m pip install 'jsonschema>=4,<5' 'ruff>=0.14,<0.15' 'mypy>=1.19,<2' types-jsonschema
      - name: Reject incompatible access models before credentials are available
        if: github.event_name == 'workflow_dispatch' && inputs.isolated_agent && inputs.with_direct_route
        run: |
          echo 'Choose isolated_agent or with_direct_route; they measure different agent authority.'
          exit 2
      - name: Lint integration files
        run: ruff check src/velvet/stripe_*.py tests/test_stripe_*.py
      - name: Type-check integration files
        run: mypy --strict --follow-imports=silent src/velvet/stripe_*.py tests/test_stripe_*.py
      - name: Run offline tests (no Stripe credentials)
        run: |
          python -m unittest discover -s tests -p 'test_stripe_shadowpath.py' -v
          python -m unittest discover -s tests -p 'test_stripe_isolated.py' -v

  native-proxy:
    name: Actual Rust proxy contract (local protocol stub, not Stripe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4,<5'
      - name: Build credential-free agent from the pinned, minimal image context
        run: |
          image="$(python -I src/velvet/stripe_isolated.py build-image)"
          echo "VELVET_STRIPE_AGENT_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Build the pinned repository proxy
        run: cargo build --locked -p velvet-rope-proxy
      - name: Prove the real proxy denies without invoking the upstream tool
        env:
          VELVET_STRIPE_PROXY_BIN: target/debug/velvet-rope-proxy
        run: python -m unittest discover -s tests -p 'test_stripe_shadowpath_proxy.py' -v

  sandbox:
    name: Hosted Stripe sandbox (explicit opt-in)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_sandbox
    needs: [offline, native-proxy]
    runs-on: ubuntu-latest
    environment: stripe-sandbox
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4,<5'
      - name: Build isolated agent before provider credentials are available
        if: inputs.isolated_agent
        run: |
          image="$(python -I src/velvet/stripe_isolated.py build-image)"
          echo "VELVET_STRIPE_AGENT_IMAGE=$image" >> "$GITHUB_ENV"
      - run: cargo build --locked -p velvet-rope-proxy
      - name: Install pinned evidence scanner before credentials are available
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: Start real gateway and execute provider-backed probe
        env:
          VELVET_STRIPE_MCP_KEY: ${{ secrets.VELVET_STRIPE_MCP_KEY }}
          VELVET_STRIPE_OBSERVER_KEY: ${{ secrets.VELVET_STRIPE_OBSERVER_KEY }}
          VELVET_STRIPE_SETUP_KEY: ${{ secrets.VELVET_STRIPE_SETUP_KEY }}
          VELVET_STRIPE_AGENT_KEY: ${{ inputs.with_direct_route && !inputs.isolated_agent && secrets.VELVET_STRIPE_AGENT_KEY || '' }}
          DIRECT_ROUTE: ${{ inputs.with_direct_route }}
          ISOLATED_AGENT: ${{ inputs.isolated_agent }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo 'Mutation reruns are refused. Reconcile prior operation IDs and charges first.'
            exit 2
          fi
          export VELVET_STRIPE_GATEWAY_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export VELVET_OAP_ED25519_PRIVATE_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export VELVET_MAXDE_ED25519_PRIVATE_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          mkdir -p reports/stripe-proxy
          python -I src/velvet/stripe_shadowpath.py discover --output reports/stripe-tools.json
          env -u VELVET_STRIPE_OBSERVER_KEY -u VELVET_STRIPE_SETUP_KEY \
            -u VELVET_STRIPE_AGENT_KEY \
            target/debug/velvet-rope-proxy --config examples/shadowpath/stripe/proxy.json \
            >reports/stripe-proxy/process.log 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              echo 'Gateway exited before readiness; no probe was run.'
              exit 4
            fi
            if curl --fail --silent http://127.0.0.1:8791/readyz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'Gateway readiness timed out; no probe was run.'
            exit 4
          fi
          args=()
          if [ "$DIRECT_ROUTE" = true ]; then args+=(--with-direct-route); fi
          if [ "$ISOLATED_AGENT" = true ]; then
            env -u VELVET_STRIPE_AGENT_KEY python -I src/velvet/stripe_isolated.py run \
              --gateway http://127.0.0.1:8791/mcp --allow-test-writes \
              --image "$VELVET_STRIPE_AGENT_IMAGE" \
              --output-dir "reports/stripe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            python -I src/velvet/stripe_shadowpath.py run \
              --gateway http://127.0.0.1:8791/mcp \
              --provision --allow-test-writes "${args[@]}" \
              --output-dir "reports/stripe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
      - name: Stage sanitized evidence even after dispatch or observation failure
        if: always()
        env:
          VELVET_STRIPE_MCP_KEY: ${{ secrets.VELVET_STRIPE_MCP_KEY }}
          VELVET_STRIPE_OBSERVER_KEY: ${{ secrets.VELVET_STRIPE_OBSERVER_KEY }}
          VELVET_STRIPE_SETUP_KEY: ${{ secrets.VELVET_STRIPE_SETUP_KEY }}
          VELVET_STRIPE_AGENT_KEY: ${{ inputs.with_direct_route && !inputs.isolated_agent && secrets.VELVET_STRIPE_AGENT_KEY || '' }}
        run: python -I src/velvet/stripe_shadowpath.py publish-evidence --source reports --output publish
      - name: Scan public evidence
        id: evidence-scan
        if: always()
        run: |
          "$(go env GOPATH)/bin/gitleaks" detect --no-git --source publish \
            --config .gitleaks.toml --redact --exit-code 1
      - name: Retain measured report even when a breach makes the job fail
        if: always() && steps.evidence-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stripe-shadowpath-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publish/stripe-*/result.json
            publish/stripe-tools.json
          if-no-files-found: warn
