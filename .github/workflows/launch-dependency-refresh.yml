name: Launch dependency repair
on:
  push:
    branches: [launch/customer-investor-readiness]
    paths: [.github/workflows/launch-dependency-refresh.yml]
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'paulchum/velvet-rope' && github.ref == 'refs/heads/launch/customer-investor-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: launch/customer-investor-readiness
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Resolve compatible security fixes without changing declared ranges
        working-directory: site
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          git diff --exit-code -- package.json
          npm ci
          npm audit --audit-level=high
          npm test
          npm run deploy:dry-run
      - name: Commit only the validated site lockfile
        run: |
          git diff --stat
          git add -- site/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = 'site/package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(site): resolve audited dependencies within existing ranges'
          git push origin HEAD:refs/heads/launch/customer-investor-readiness
