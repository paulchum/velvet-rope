name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build Python wheels (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Use pinned Rust toolchain
        run: rustup show
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Build Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: build
          args: --release --out dist
          manylinux: auto
      - name: Build macOS wheel
        if: runner.os == 'macOS'
        run: uv run maturin build --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*

  build-proxy:
    name: Build proxy binary (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Use pinned Rust toolchain
        run: rustup show
      - name: Build proxy
        run: cargo build --release -p velvet-rope-proxy
      - name: Package proxy
        shell: bash
        run: |
          mkdir -p dist
          name="velvet-rope-proxy-${RUNNER_OS}-${RUNNER_ARCH}"
          cp target/release/velvet-rope-proxy "dist/${name}"
          shasum -a 256 "dist/${name}" > "dist/${name}.sha256"
      - name: Upload proxy binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proxy-${{ matrix.os }}
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: [build-wheels, build-proxy]
    environment: pypi
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Use pinned Rust toolchain
        run: rustup show
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Install ShadowPath Chromium
        run: |
          uv run playwright install-deps chromium
          uv run playwright install chromium
      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts
      - name: Collect artifacts
        run: |
          mkdir -p dist python-dist
          find release-artifacts -maxdepth 2 -type f -name '*.whl' -print -exec cp {} python-dist/ \;
          find release-artifacts -maxdepth 2 -type f -print -exec cp {} dist/ \;
      - name: Verify release policy
        run: |
          uv lock --check
          uv run python scripts/check_workflows.py
          uv run python scripts/check_no_npm.py
      - name: Lint and type check
        run: |
          uv run ruff check .
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          uv run python -m mypy src tests
      - name: Test
        run: |
          cargo test --workspace
          uv run python -m pytest
      - name: Audit and security scan
        run: |
          uv run python -m pip_audit
          uv run python -m bandit -q -r src
      - name: Generate SBOM
        run: uv run python scripts/generate_sbom.py --output build/sbom.json
      - name: Build source distribution
        run: |
          uv build --sdist --out-dir python-dist
          cp python-dist/* dist/
      - name: Check Python distributions
        shell: bash
        run: |
          uv run python -m pip install twine
          uv run python -m twine check python-dist/*
          python - <<'PY'
          from pathlib import Path

          linux_wheels = sorted(path for path in Path("python-dist").glob("*linux*.whl"))
          if not linux_wheels:
              raise SystemExit("No Linux wheels found in python-dist")
          for wheel in linux_wheels:
              if "manylinux" not in wheel.name:
                  raise SystemExit(f"Linux wheel is not tagged manylinux: {wheel.name}")
          PY
      - name: Generate checksums and SLSA provenance
        run: |
          shasum -a 256 dist/* build/sbom.json > dist/SHA256SUMS
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          subjects = []
          for path in sorted(Path("dist").glob("*")) + [Path("build/sbom.json")]:
              if path.is_file() and path.name != "SHA256SUMS":
                  subjects.append({
                      "name": path.as_posix(),
                      "digest": {"sha256": hashlib.sha256(path.read_bytes()).hexdigest()},
                  })
          payload = {
              "_type": "https://in-toto.io/Statement/v1",
              "predicateType": "https://slsa.dev/provenance/v1",
              "subject": subjects,
              "predicate": {
                  "buildDefinition": {
                    "buildType": "https://github.com/paulchum/velvet-rope/.github/workflows/release.yml@v1",
                      "externalParameters": {"ref": os.environ.get("GITHUB_REF_NAME", "")},
                      "internalParameters": {},
                      "resolvedDependencies": [],
                  },
                  "runDetails": {
                      "builder": {"id": os.environ.get("GITHUB_SERVER_URL", "https://github.com") + "/" + os.environ.get("GITHUB_REPOSITORY", "") + "/actions/runs/" + os.environ.get("GITHUB_RUN_ID", "")},
                      "metadata": {"invocationId": os.environ.get("GITHUB_RUN_ID", "")},
                      "byproducts": [],
                  },
              },
          }
          Path("dist/slsa-provenance.intoto.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Sign release artifacts with cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.1
          export PATH="${HOME}/go/bin:${PATH}"
          for artifact in dist/* build/sbom.json; do
            cosign sign-blob --yes --bundle "${artifact}.cosign.bundle" "${artifact}"
          done
      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* build/sbom.json build/sbom.json.cosign.bundle --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* build/sbom.json build/sbom.json.cosign.bundle --verify-tag --title "${GITHUB_REF_NAME}" --notes "Velvet ${GITHUB_REF_NAME}"
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0
        with:
          packages-dir: python-dist

  publish-image:
    runs-on: ubuntu-latest
    needs: [build-proxy]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/paulchum/velvet-rope-proxy"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build and push proxy image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/mcp_proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
      - name: Sign proxy image with cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.1
          export PATH="${HOME}/go/bin:${PATH}"
          cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
      - name: Record image SBOM note
        run: |
          {
            echo "### Proxy image SBOM"
            echo "Skipped image SBOM attachment: existing scripts/generate_sbom.py emits the project dependency SBOM and does not target OCI images."
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-shadowpath-image:
    name: Publish one-command ShadowPath image
    runs-on: ubuntu-latest
    needs: [build-wheels]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Download wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wheels-*
          path: shadowpath-dist
          merge-multiple: true
      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/paulchum/shadowpath"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build and push ShadowPath
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/shadowpath/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
      - name: Sign ShadowPath image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.1
          export PATH="${HOME}/go/bin:${PATH}"
          cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
