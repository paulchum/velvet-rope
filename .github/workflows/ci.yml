name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  site:
    name: Astro site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and test
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Validate Cloudflare deployment bundle
        run: npm run deploy:dry-run

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Use pinned Rust toolchain
        run: rustup show
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Install ShadowPath Chromium dependencies
        if: runner.os == 'Linux'
        run: uv run playwright install-deps chromium
      - name: Install ShadowPath Chromium
        run: uv run playwright install chromium
      - name: Check lockfile
        run: uv lock --check
      - name: Lint
        run: uv run ruff check .
      - name: Rust format check
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Claim language check
        run: uv run python scripts/check-claim-language.py
      - name: Rust test
        run: cargo test --workspace
      - name: Proof contract checks
        run: |
          cargo test -p velvet-core canonicalization
          cargo test -p velvet-rope-proxy ledger_records_forwarding_truth_for_execute_escalate_and_block
          uv run pytest tests/test_proof_contract_naming.py tests/test_canonicalization_contract.py tests/test_launch_readiness.py tests/test_mcp_proxy_cli.py -q
          make seal-conformance
          uv run velvet launch-demo --output-dir reports/launch --json
          uv run velvet ledger validate --ledger reports/launch/velvet_ledger.vledger --json
          uv run velvet ledger verify --ledger reports/launch/velvet_ledger.vledger --json
      - name: Eval benchmark diff
        run: |
          mkdir -p build
          cargo run -q -p velvet-eval -- bench --suite tau_bench
          cargo run -q -p velvet-eval -- diff --baseline bench_tau_bench --candidate bench_tau_bench | tee build/eval-diff.txt
      - name: Post eval diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="$(python - <<'PY'
          from pathlib import Path
          text = Path("build/eval-diff.txt").read_text(encoding="utf-8")
          print("### Velvet eval diff\n\n```text\n" + text[:60000] + "\n```")
          PY
          )"
          gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$body"
      - name: Label routing behavior change
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          if grep -q '^routing_behavior_change=true$' build/eval-diff.txt; then
            gh api -X POST "repos/${GH_REPO}/labels" \
              -f name='routing-behavior-change' \
              -f color='BFD4F2' \
              -f description='Eval diff detected routing behavior changes' >/dev/null 2>&1 || true
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
              -f labels[]='routing-behavior-change'
          fi
      - name: Sandbox-required feature test
        run: cargo test -p velvet-core --features sandbox-required
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest
      - name: Audit Python dependencies
        run: uv run pip-audit
      - name: Static security scan
        run: uv run bandit -q -r src
      - name: Workflow policy check
        run: uv run python scripts/check_workflows.py
      - name: npm exclusion check
        run: uv run python scripts/check_no_npm.py
      - name: Generate SBOM
        run: uv run python scripts/generate_sbom.py --output build/sbom.json

  oss-scrub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Export curated OSS tree
        run: uv run python scripts/export_oss_tree.py --out build/oss/velvet --check
      - name: Assert publish safety
        run: uv run python scripts/check_publish_safety.py build/oss/velvet
      - name: Install cargo-deny and secret scanners
        run: |
          cargo install cargo-deny --locked --version 0.19.4
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          sudo install "$(go env GOPATH)/bin/gitleaks" /usr/local/bin/gitleaks
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.90.5/trufflehog_3.90.5_linux_amd64.tar.gz -o /tmp/trufflehog.tar.gz
          tar -xzf /tmp/trufflehog.tar.gz -C /tmp trufflehog
          sudo install /tmp/trufflehog /usr/local/bin/trufflehog
      - name: Cargo advisory and license checks
        run: cargo deny check advisories licenses
      - name: Scan curated tree with gitleaks
        run: gitleaks detect --no-git --source build/oss/velvet --config .gitleaks.toml --redact --exit-code 1
      - name: Scan curated tree with trufflehog
        run: |
          trufflehog filesystem build/oss/velvet --no-update --json > build/trufflehog.jsonl
          uv run python scripts/check_trufflehog_findings.py \
            build/trufflehog.jsonl \
            --source-root build/oss/velvet

  live-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run live demo suite
        run: make live-demo
      - name: Upload live demo evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-demo-evidence
          path: reports/live-demo
